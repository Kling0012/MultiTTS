[package]
name = "t"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

serenity = { version = "0.11", default-features = false, features = ["client", "gateway", "http", "model", "rustls_backend", "utils", "cache"] }
songbird = "0.3"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"  # 追加：URLエンコード用
whatlang = "0.16"


